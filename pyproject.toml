[project]
name = "vjev"
version = "0.1.0"
description = "Video Jev: a typed, calibrated decision model for video"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "modal>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8",
    "ruff>=0.6",
    "torch>=2.14.1",
    "wandb>=0.30.0",
    "wandb-workspaces>=0.4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
# Third-party code kept byte-for-byte with upstream.
extend-exclude = ["vjev/clef_schema.py", "release/vjev/clef_schema.py",
                  "comfyui/ComfyUI-VideoJev/vjev/clef_schema.py"]

[tool.ruff.lint.per-file-ignores]
# ComfyUI node packages are named like this by convention.
"comfyui/ComfyUI-VideoJev/**" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
